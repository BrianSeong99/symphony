version: 1

sync_profiles:
  - native-full-sync
  - relay-full-sync
  - relay-pr-only
  - relay-context-only
  - no-github

github_integration:
  github_app_org_access: connected
  personal_account_connection: connected
  private_repositories: enabled
  branch_format: enabled
  linkbacks: enabled
  pr_linking: enabled
  commit_linking: enabled
  checks: enabled
  reviews: enabled
  github_issues_sync_default: disabled
  native_issue_sync_policy: explicit_exception_only
  notes:
    - Native GitHub integration means PRs, commits, checks, reviews, diffs, branches, and linkbacks.
    - GitHub Issues Sync is disabled by default and must be enabled only as an explicit per-project exception.

checkpoint_cadence:
  default: weekly
  project_overrides:
    symphony: twice-weekly
    docs: twice-weekly
    miden-testnet-bridge: twice-weekly
    miden-wallet: twice-weekly
    omega-interface: twice-weekly
    omega-zone: twice-weekly

project_policy:
  default_project_unit: homelab_project
  homelab_projects:
    preferred: true
    source_file: /Users/brianseong/Develop/Labs/homelab/data/v3/state.yaml
  repos:
    project_unit: metadata
    allowed_representations:
      - metadata
      - label
      - custom_field

operating_domains:
  - key: labs
    name: Labs
    homelab_workspace_id: labs
    linear_team_key: LAB
    allowed_sync_profiles:
      - native-full-sync
      - relay-pr-only
      - relay-context-only
      - no-github
    github_issue_sync:
      native_allowed: true
      reason: Brian-owned Labs repositories can use GitHub Issues Sync only as an explicit project exception; native PR/check/review/linkbacks remain enabled.
    default_checkpoint_cadence: weekly

  - key: miden
    name: Miden
    homelab_workspace_id: miden
    linear_team_key: MID
    allowed_sync_profiles:
      - relay-pr-only
      - relay-context-only
      - no-github
    github_issue_sync:
      native_allowed: false
      reason: Miden repositories are public/company-owned surfaces; GitHub Issues Sync is disabled.
    default_checkpoint_cadence: twice-weekly

  - key: chainless
    name: Chainless
    homelab_workspace_id: chainless
    linear_team_key: OMA
    allowed_sync_profiles:
      - relay-full-sync
      - relay-pr-only
      - relay-context-only
      - no-github
    github_issue_sync:
      native_allowed: false
      reason: Respect the existing Omega/Chainless team workflow; GitHub Issues Sync is disabled.
    default_checkpoint_cadence: twice-weekly

  - key: wprc
    name: WPRC
    homelab_workspace_id: wprc
    linear_team_key: WPRC
    allowed_sync_profiles:
      - native-full-sync
      - relay-pr-only
      - relay-context-only
      - no-github
    github_issue_sync:
      native_allowed: true
      reason: WPRC repositories Brian controls can use GitHub Issues Sync only as an explicit project exception; native PR/check/review/linkbacks remain enabled.
    default_checkpoint_cadence: weekly

  - key: personal
    name: Personal
    homelab_workspace_id: personal
    linear_team_key: PER
    allowed_sync_profiles:
      - native-full-sync
      - relay-pr-only
      - relay-context-only
      - no-github
    github_issue_sync:
      native_allowed: true
      reason: Brian-owned Personal repositories can use GitHub Issues Sync only as an explicit project exception; native PR/check/review/linkbacks remain enabled.
    default_checkpoint_cadence: weekly

