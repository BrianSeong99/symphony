version: 1
default_template: symphony

redaction_rules:
  private_runtime:
    fields:
      - workpad
      - agent_memory
      - run_metrics
    public_action: drop
    reason: private_runtime
  private_strategy:
    fields:
      - planning_notes
      - private_comments
    public_action: drop
    reason: private_strategy
  sensitive_partner_context:
    fields:
      - public_comments
      - validation
    markers:
      - "[partner-private]"
      - "[sensitive-partner]"
    public_action: replace
    replacement: "[redacted:sensitive_partner_context]"
    reason: sensitive_partner_context

templates:
  homelab:
    profile: homelab
    operating_domain: homelab-personal
    default_mode: native
    modes:
      native:
        sync_strategy: native-full-sync
        disabled_surfaces: []
    surfaces:
      linear:
        target: linear
        visibility: private_cockpit
        mode: native_full_sync
        fields:
          - title
          - status
          - planning_notes
          - workpad
          - dependencies
          - pr_state
          - checks
          - public_comments
          - private_comments
          - validation
          - run_metrics
      github_issue:
        target: github
        visibility: public
        mode: native_full_sync
        fields:
          - title
          - dependencies
          - validation
          - public_comments
      github_pr:
        target: github
        visibility: public
        mode: native_pr_link
        fields:
          - pr_state
          - checks
          - validation
          - public_comments
      linear_comment:
        target: linear
        visibility: private_cockpit
        mode: comment_thread
        fields:
          - public_comments
          - private_comments
          - validation
          - run_metrics
      github_comment:
        target: github
        visibility: public
        mode: public_comment
        fields:
          - public_comments
          - validation
      run_summary:
        target: linear
        visibility: private_cockpit
        mode: run_summary
        fields:
          - pr_state
          - checks
          - validation
          - run_metrics
      checkpoint_request:
        target: linear
        visibility: private_cockpit
        mode: checkpoint_request
        fields:
          - dependencies
          - validation
          - public_comments
      symphony:
        target: symphony
        visibility: private_runtime
        mode: runtime_truth
        fields:
          - title
          - status
          - planning_notes
          - workpad
          - dependencies
          - agent_memory
          - pr_state
          - checks
          - public_comments
          - private_comments
          - validation
          - run_metrics

