version: 1
scenario_order:
  - homelab_native_full_sync
  - miden_private_linear_relay
  - chainless_existing_team_relay
  - wprc_controlled_native_sync
  - loop_breaker_human_checkpoint
  - scheduler_parallel_dag

scenarios:
  homelab_native_full_sync:
    workspace: homelab
    template: homelab
    mode: native
    projection:
      approvals:
        - public_comments
      capabilities:
        edit_issues: true
        comment: true
    values:
      title: Homelab health endpoint propagation
      planning_notes: Private rollout notes for homelab service health checks.
      workpad: Keep the Docker health endpoint migration in the private workpad.
      dependencies:
        - SYM-2
      agent_memory: Persistent builder context for the homelab stack.
      pr_state: open
      checks: green
      validation: mix test passed
      public_comments: Ready for PR validation.
      private_comments: Private operational note.
      run_metrics:
        retry_count: 0
    linear_intake:
      source: linear_intelligence
      project_id: 1
      symphony_issue_id: 18
      profile: homelab
      triage:
        labels:
          - homelab
          - runtime
        owner: Brian
        project: homelab
        priority: high
      agent:
        dependencies:
          - SYM-2
        workpad_amendments:
          - section: Scope Interpretation
            text: Keep the health check rollout tied to the PR validation path.
        checkpoint_requests:
          - reason: Confirm PR validation before merge.
            cadence: before-merge
    linear_accept:
      approved_kinds:
        - workpad_amendment
        - dependency
        - checkpoint_request
    project:
      name: Homelab
      slug: homelab
      workspace: labs
    github:
      connection_mode: full_sync
      owner: BrianSeong99
      repo: homelab
      capabilities:
        create_issues: true
        edit_issues: true
        create_labels: true
        edit_milestones: true
        comment: true
        create_prs: true
        read_prs: true
        read_checks: true
        read_reviews: true
      context:
        project_id: 1
        symphony_issue_id: 18
        title: Homelab health endpoint propagation
        body: Public issue body.
        dependency_summary: "Depends on: #2 persistence"
        labels:
          - symphony
          - homelab
        milestone_title: Linear cockpit + Symphony kernel v1
        workpad_body: Planning notes summary.
        github_pr_number: 51
        review_state: approved
        review_body: Validation passed.
        explicit_pr_association: true
        explicit_public_comment: true
    scheduler:
      max_concurrency: 2
      issues:
        - id: 101
          project_id: 1
          title: Sync Linear issue
          status: ready
        - id: 102
          project_id: 1
          title: Add PR validation
          status: ready
        - id: 103
          project_id: 1
          title: Merge homelab rollout
          status: ready
      edges:
        - dependent_issue_id: 103
          dependency_issue_id: 102
          unblock_condition: PR validation path green
    review:
      issue:
        id: 18
        title: Homelab PR validation
      feedback:
        - type: check_failure
          name: mix test
          body: Initial validation failed before repair.
      validation:
        status: passed
        evidence: mix test passed
    conflict:
      project_id: 1
      symphony_issue_id: 18
      required_links:
        - github_issue
        - github_pr
      links:
        github_issue: https://github.com/BrianSeong99/homelab/issues/18
        github_pr: https://github.com/BrianSeong99/homelab/pull/51
      webhook:
        provider: linear
        event_id: evt-homelab
        occurred_at: "2026-05-24T00:00:00Z"
        last_seen_at: "2026-05-24T00:00:00Z"
      expected:
        linear:
          title: Homelab health endpoint propagation
        github_issue:
          body: Public issue body.
        github_pr:
          state: open
        dependencies:
          - SYM-2
      observed:
        linear:
          title: Homelab health endpoint propagation
        github_issue:
          body: Public issue body.
        github_pr:
          state: open
        dependencies:
          - SYM-2

