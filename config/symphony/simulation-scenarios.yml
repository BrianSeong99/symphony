  loop_breaker_human_checkpoint:
    workspace: symphony
    kind: loop_breaker
    loop_breaker:
      repeated_failure:
        issue:
          id: 301
          title: Repair validation loop
        feedback:
          - type: comment
            body: Fix the failing validation.
        events:
          - kind: validation_failure
            phase: validation
            attempt: 1
            command: mix test
            output: same failure
          - kind: validation_failure
            phase: validation
            attempt: 2
            command: mix test
            output: same failure
        validation:
          status: failed
          evidence: same failure
      spec_mismatch:
        issue:
          id: 302
          title: Resolve validation mismatch
        feedback:
          - type: comment
            body: Validation and issue spec disagree.
        events:
          - kind: validation_spec_contradiction
            phase: validation
            validation: mix test --exclude live_e2e
            spec: Run live worker test
            reason: Validation excludes required live worker test.

  scheduler_parallel_dag:
    workspace: symphony
    kind: scheduler
    scheduler:
      max_concurrency: 2
      issues:
        - id: 201
          project_id: 5
          title: Persistence foundation
          status: done
        - id: 202
          project_id: 5
          title: Build projection templates
          status: ready
        - id: 203
          project_id: 5
          title: Add Linear actions
          status: ready
        - id: 204
          project_id: 5
          title: Simulate Homelab rollout
          status: ready
        - id: 205
          project_id: 5
          title: Build runtime console
          status: ready
      edges:
        - dependent_issue_id: 204
          dependency_issue_id: 202
          unblock_condition: projection templates merged
